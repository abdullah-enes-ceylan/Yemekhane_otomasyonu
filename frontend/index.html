<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/giris.js" defer></script>
</head>
<body>
  <main class="giris-sayfasi kapsayici">
    <section class="giris-kutusu kart">
      <h1>Yemekhane</h1>
      <p class="alt-baslik">Kampüs yemekhanesi rezervasyon sistemi</p>

      <p id="giris-bildirimi" class="bildirim" hidden></p>

      <form id="giris-formu" novalidate>
        <div class="form-alani">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" inputmode="email" maxlength="120" required>
        </div>
        <div class="form-alani">
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" maxlength="72" required>
        </div>
        <button type="submit" class="dugme dugme-tam">Giriş yap</button>
      </form>
    </section>
  </main>
</body>
</html>
