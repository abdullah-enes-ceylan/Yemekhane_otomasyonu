ServerName uygulama
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8000>
    DocumentRoot /var/www/uygulama/public

    <Directory /var/www/uygulama/public>
        AllowOverride None
        Require all granted
        # Diskte karşılığı olmayan her istek (/api/...) tek giriş noktasına gider
        FallbackResource /index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
