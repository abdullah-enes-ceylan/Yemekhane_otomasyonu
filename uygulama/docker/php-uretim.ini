; Hatalar kullanıcıya gösterilmez, container günlüğüne (stderr) yazılır
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; Doğrudan container çıktısına yaz; Apache'nin hata günlüğü Türkçe karakterleri \xNN olarak kaçırıyor
error_log = /dev/stderr

expose_php = Off
default_charset = "UTF-8"
date.timezone = Europe/Istanbul

opcache.enable = 1
; Kod imaja gömülü ve değişmiyor; dosya zaman damgasını her istekte kontrol etmeye gerek yok
opcache.validate_timestamps = 0
